name: file_drop_app
description: Native Android/iOS client for your File Drop server (auth, files, upload).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.3+1                 # HTTP client — handles multipart upload + interceptors cleanly
  flutter_secure_storage: ^9.2.2 # stores server URL + credentials in Android Keystore / iOS Keychain
  file_picker: ^6.1.1             # native file picker for uploads (pinned below 8.x — newer releases pull in a transitive dependency requiring Android SDK 35, which is crashing on the CI runner)
  intl: ^0.19.0                  # date/size formatting

# Forces the actual conflicting transitive package to a version that only
# needs Android SDK 34. Downgrading file_picker alone wasn't enough — Pub
# resolves to the HIGHEST version any dependent allows, and
# flutter_secure_storage likely also pulls this package in, so it kept
# resolving to a version requiring SDK 35 regardless. This overrides it
# directly, bypassing that resolution entirely.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
